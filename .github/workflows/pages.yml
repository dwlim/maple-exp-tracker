name: Deploy Maple Track

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install OCR validation dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Check browser capture and OCR
        run: node tools/test-app.cjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Prepare public app files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp dashboard.css _site/dashboard.css
          cp -R assets _site/assets
          cp -R third_party _site/third_party
          cp stream-card.js potion-costs.js level-ocr.js hud-ocr.js hud-regions.js local-ocr.js session.js quickslot-worker.js quickslot-font.js quickslot-small.js quickslot-ocr.js quickslot-layout.js quickslot-session.js quickslots.js _site/
          cp tools/browser-ocr-check.html _site/ocr-check.html
          cp tools/browser-quickslot-check.html _site/quickslot-check.html
          mkdir -p _site/assets/validation
          cp tools/stream-holdout-fixtures.json tools/quickslot-font-fixtures.json tools/quickslot-layout-fixtures.json tools/quickslot-sequence-fixtures.json tools/quickslot-tail-fixtures.json _site/assets/validation/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
