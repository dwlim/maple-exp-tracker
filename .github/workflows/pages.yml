name: Deploy Maple Track

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install OCR validation dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - name: Check browser capture and OCR
        run: node tools/test-app.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public app files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp level-ocr.js hud-ocr.js hud-regions.js local-ocr.js session.js _site/
          cp tools/browser-ocr-check.html _site/ocr-check.html
          mkdir -p _site/assets/validation
          cp tools/stream-holdout-fixtures.json _site/assets/validation/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
