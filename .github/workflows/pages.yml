name: Deploy Maple Track

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check browser capture and OCR
        run: |
          node tools/test-browser-capture.cjs
          node tools/test-burst-capture.cjs
          node tools/test-stream-card.cjs
          node tools/test-debug-downloads.cjs
          node tools/test-level-ocr.cjs
          node tools/test-level-inference.cjs
          node tools/test-hud-regions.cjs
          node tools/test-percentage-only.cjs
          node tools/test-hud-font.cjs
          node tools/stress-hud-font.cjs --strict
      - uses: actions/configure-pages@v5
      - name: Prepare public app files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
