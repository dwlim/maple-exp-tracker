<!doctype html><html lang="en"><meta charset="utf-8"><title>Quickslot OCR self-check</title><style>body{background:#15161c;color:#ececf0;font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}button{padding:12px}pre{white-space:pre-wrap}canvas{image-rendering:pixelated;max-height:100px}</style><h1>Quickslot OCR self-check</h1><p>This checks quantity-only regression crops using the real local Web Worker. It does not access screen sharing or a live session.</p><button id="run">Run quantity checks</button><pre id="results">Ready</pre><script>
const out=document.querySelector('#results'),button=document.querySelector('#run');button.onclick=async()=>{button.disabled=true;out.textContent='Running real worker checks…';let worker;try{const fixtures=await (await fetch('assets/validation/quickslot-font-fixtures.json')).json();worker=new Worker('quickslot-worker.js');let passed=0,lines=[];for(let id=0;id<fixtures.length;id++){const f=fixtures[id],bytes=Uint8Array.from(atob(f.rgba),c=>c.charCodeAt(0)),rgba=new Uint8ClampedArray(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer()),result=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Worker timed out')),5000);worker.onmessage=e=>{if(e.data.id===id){clearTimeout(timer);resolve(e.data.result);}};worker.onerror=e=>{clearTimeout(timer);reject(Error(e.message));};worker.postMessage({id,image:{width:f.width,height:f.height,data:rgba}},[rgba.buffer]);});const ok=result?.count===Number(f.text);if(ok)passed++;lines.push((ok?'PASS ':'FAIL ')+f.name+' → '+(result?.count??'unreadable'));out.textContent=lines.join('\n');}out.textContent+='\n'+passed+'/'+fixtures.length+' quantity crops passed in the browser worker.';}catch(e){out.textContent+='\nERROR: '+e.message;}finally{worker?.terminate();button.disabled=false;}};
</script></html>
